name: registry-automerge

# Merges a pull request that only adds new CLI themes, after the ci workflow
# succeeded for its head commit. Anything else waits for a maintainer.
#
# This workflow runs from the default branch with a write token, so it never
# checks out or executes code from the pull request. It reads the changed file
# paths through the API and passes them to a script from main.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Merge eligible pull request
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
            --jq '[.[] | select(.state == "open" and .base.ref == "main")][0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open pull request for $HEAD_SHA."
            exit 0
          fi
          read -r draft head < <(gh api "repos/$REPO/pulls/$pr" \
            --jq '[.draft, .head.sha] | @tsv')
          if [ "$draft" = "true" ] || [ "$head" != "$HEAD_SHA" ]; then
            echo "Pull request $pr is a draft or has newer commits."
            exit 0
          fi
          gh api --paginate "repos/$REPO/pulls/$pr/files" \
            --jq '[.[] | {status, filename}]' | jq -s 'add' > files.json
          if ! pnpm exec tsx scripts/pr-eligibility.ts < files.json; then
            exit 0
          fi
          gh pr merge "$pr" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"
